<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tidebar</title>
  <link rel="stylesheet" href="styles.css">
  <script src="setup.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.2/src/fill/style.css">
  <link rel="shortcut icon" href="logo.png" type="image/png">
  <script src="https://darkerguy.github.io/shorebase/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
</head>
<body>
  <main>
    <h1>Give feedback on Tidebar</h1>
    <p>If you have something to say about Tidebar, see a bug, want a feature or just want to tell me what you think, go ahead and do it.</p>

    <form action="https://bforms.dev/api/f/DVux6T2yngAy" method="POST">
      <label for="message" class="bcolor">Tell me what you think about Tidebar and how should I improve it.</label>
      <textarea id="message" name="message" placeholder="Share your thoughts and ideas" required></textarea>

      <input type="range" name="rating" min="1" max="10" style="display:none" tabindex="-1" autocomplete="off" />

      <div class="row gap-5">
        <button type="submit" class="push primary">Send</button>
        <button type="button" onclick="window.history.back()">Cancel</button>
      </div>
    </form>
  </main>
  </footer>
</body>
</html>
